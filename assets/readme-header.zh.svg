<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="808" viewBox="0 0 1466 808" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">MacCleaner</title>
  <desc id="desc">安全、分阶段的 macOS 存储审计和清理流程：审计、计划、批准、执行、验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1466" height="808" rx="0" fill="url(#bg)"/>
  <circle cx="1170" cy="130" r="260" fill="#22c55e" opacity="0.16"/>
  <circle cx="205" cy="680" r="330" fill="#38bdf8" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="116" y="112" width="1234" height="584" rx="44" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.26"/>
  </g>
  <text x="168" y="238" fill="#ecfeff" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Segoe UI,Helvetica,Arial,sans-serif" font-size="82" font-weight="800">MacCleaner</text>
  <text x="172" y="304" fill="#d1fae5" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Segoe UI,Helvetica,Arial,sans-serif" font-size="30">先审计 · 精确目标编号 · 受保护会话保持阻断 · 回执已脱敏</text>
  <g transform="translate(172 386)" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Segoe UI,Helvetica,Arial,sans-serif">
    <g text-anchor="middle">
      <rect width="190" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="95" y="48" fill="#0f172a" font-size="26" font-weight="700">1 审计</text>
      <text x="95" y="82" fill="#334155" font-size="18">只读扫描</text>
    </g>
    <path d="M215 56h48" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M251 34l28 22-28 22" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(306 0)" text-anchor="middle">
      <rect width="190" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="95" y="48" fill="#0f172a" font-size="26" font-weight="700">2 计划</text>
      <text x="95" y="82" fill="#334155" font-size="18">精确目标</text>
    </g>
    <path d="M521 56h48" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M557 34l28 22-28 22" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(612 0)" text-anchor="middle">
      <rect width="190" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="95" y="48" fill="#0f172a" font-size="26" font-weight="700">3 批准</text>
      <text x="95" y="82" fill="#334155" font-size="18">仅限目标编号</text>
    </g>
    <path d="M827 56h48" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M863 34l28 22-28 22" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(932 0)" text-anchor="middle">
      <rect width="190" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="95" y="48" fill="#0f172a" font-size="26" font-weight="700">4 验证</text>
      <text x="95" y="82" fill="#334155" font-size="18">回执与复查</text>
    </g>
  </g>
  <g transform="translate(313 568)" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#ecfeff" text-anchor="middle">
    <rect width="260" height="54" rx="27" fill="#064e3b" opacity="0.78"/>
    <text x="130" y="36">默认通用模式</text>
    <rect x="290" width="260" height="54" rx="27" fill="#064e3b" opacity="0.78"/>
    <text x="420" y="36">项目证据按需启用</text>
    <rect x="580" width="260" height="54" rx="27" fill="#064e3b" opacity="0.78"/>
    <text x="710" y="36">不删除会话数据</text>
  </g>
</svg>
