<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="808" viewBox="0 0 1466 808" role="img" aria-labelledby="title desc">
  <title id="title">Mac Storage Manager</title>
  <desc id="desc">A generic open-source macOS storage cleanup workflow: audit, plan, approve, apply, verify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1466" height="808" rx="0" fill="url(#bg)"/>
  <circle cx="1170" cy="130" r="260" fill="#22c55e" opacity="0.16"/>
  <circle cx="205" cy="680" r="330" fill="#38bdf8" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="116" y="112" width="1234" height="584" rx="44" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.26"/>
  </g>
  <text x="168" y="238" fill="#ecfeff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="82" font-weight="800">Mac Storage Manager</text>
  <text x="172" y="304" fill="#d1fae5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="30">Audit first · exact target IDs · protected sessions blocked · redacted receipts</text>
  <g transform="translate(172 386)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <g>
      <rect width="190" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="32" y="48" fill="#0f172a" font-size="26" font-weight="700">1 Audit</text>
      <text x="32" y="82" fill="#334155" font-size="18">read-only scan</text>
    </g>
    <path d="M215 56h72" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M275 34l28 22-28 22" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(330 0)">
      <rect width="190" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="32" y="48" fill="#0f172a" font-size="26" font-weight="700">2 Plan</text>
      <text x="32" y="82" fill="#334155" font-size="18">exact targets</text>
    </g>
    <path d="M545 56h72" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M605 34l28 22-28 22" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(660 0)">
      <rect width="210" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="32" y="48" fill="#0f172a" font-size="26" font-weight="700">3 Approve</text>
      <text x="32" y="82" fill="#334155" font-size="18">target IDs only</text>
    </g>
    <path d="M895 56h72" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
    <path d="M955 34l28 22-28 22" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1010 0)">
      <rect width="190" height="112" rx="24" fill="#ecfeff" opacity="0.94"/>
      <text x="32" y="48" fill="#0f172a" font-size="26" font-weight="700">4 Verify</text>
      <text x="32" y="82" fill="#334155" font-size="18">receipt + audit</text>
    </g>
  </g>
  <g transform="translate(172 568)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#ecfeff">
    <rect width="246" height="54" rx="27" fill="#064e3b" opacity="0.78"/>
    <text x="28" y="36">generic by default</text>
    <rect x="276" width="252" height="54" rx="27" fill="#064e3b" opacity="0.78"/>
    <text x="304" y="36">repo-evidence opt-in</text>
    <rect x="558" width="276" height="54" rx="27" fill="#064e3b" opacity="0.78"/>
    <text x="586" y="36">no session deletion</text>
  </g>
</svg>
