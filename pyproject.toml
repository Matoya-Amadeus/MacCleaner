[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maccleaner"
version = "0.1.0"
description = "Safe, staged macOS storage audit and cleanup CLI"
readme = { file = "README.en.md", content-type = "text/markdown" }
requires-python = ">=3.10"
# 兼容写法：`license = "MIT"` + `license-files` 属于 PEP 639，需要 setuptools>=77，
# 而本文件声明的最低版本是 >=61 —— 那会让旧环境（如 setuptools 63）直接构建失败
# （2026-10-19 实测：`ValueError: invalid pyproject.toml config: project.license`）。
# 表格式 `{ text = ... }` 从 PEP 621 起就支持，全版本可用。
license = { text = "MIT" }
authors = [{ name = "MacCleaner contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]

[project.scripts]
maccleaner = "maccleaner.cli:main"
maccleaner-mcp = "maccleaner.mcp_server:main"
maccleaner-core = "maccleaner.core_cli:main"

[project.urls]
Homepage = "https://github.com/Matoya-Amadeus/MacCleaner"
Repository = "https://github.com/Matoya-Amadeus/MacCleaner"
Issues = "https://github.com/Matoya-Amadeus/MacCleaner/issues"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

# 残留规则是数据文件，必须跟着包走（否则装完读不到，只剩代码里的兜底两条）。
[tool.setuptools.package-data]
maccleaner = ["data/*.json"]
